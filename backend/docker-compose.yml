
services:

  # ─── Backend Application ──────────────────────────────────
  backend:
    build: .
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/course_registration}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pw}
    ports:
      - "8080:8080"
    restart: unless-stopped

    depends_on:
      - postgres

    volumes:
      - app-logs:/app/logs

    networks:
      - app-network

  # ─── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-course_registration}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports :
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─── Email Testing ────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"   # Web UI: view sent emails
      - "1025:1025"   # SMTP
    networks:
      - app-network

# ─── Persistent Storage ──────────────────────────────────────
volumes:
  postgres-data:
  app-logs:

# ─── Networks ────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge