<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Email</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
        }
        .header {
            background: #0b5ed7;
            color: white;
            text-align: center;
            padding: 25px;
        }
        .content {
            padding: 40px;
            color: #333;
            line-height: 1.7;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        .footer {
            background: #f7f7f7;
            padding: 25px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }
        .warning {
            background: #fff3cd;
            border-left: 5px solid orange;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 th:text="${model.applicationName}"></h2>
    </div>

    <div class="content" th:utext="${contentHtml}"></div>

    <div class="footer">
        &copy; <span>X University</span>
        <br><br>
        Need help?
        <a th:href="'mailto:' + ${model.supportEmail}" th:text="${model.supportEmail}"></a>
    </div>
</div>
</body>
</html>
