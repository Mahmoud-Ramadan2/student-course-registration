<div th:fragment="content">
    <h2>Hello <span th:text="${model.username}"></span>,</h2>

    <p>Your password has been changed successfully.</p>

    <p>Changed at:
        <strong th:text="${model.changedAt != null} ? ${#temporals.format(model.changedAt, 'yyyy-MM-dd HH:mm:ss')} : 'N/A'"></strong>
    </p>

    <div th:replace="~{emails/fragments :: warning('If you did not change your password, contact support immediately.')}"></div>
</div>
