<div th:fragment="content">
    <h2>Hello <span th:text="${model.username}"></span>,</h2>

    <p>A request was received to reset your password.</p>

    <div th:replace="~{emails/fragments :: button(${model.url}, 'Reset Password')}"></div>

    <p>This link expires in
        <strong th:text="${model.expiresInHours}"></strong> hour(s).</p>

    <div th:replace="~{emails/fragments :: warning('If you did not request this password reset, ignore this email.')}"></div>
</div>
